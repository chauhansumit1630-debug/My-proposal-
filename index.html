<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>For Someone Special ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ff416c,#ff4b2b);
  display:flex; justify-content:center; align-items:center;
}
.card{
  width:90%; max-width:400px; padding:35px 25px;
  text-align:center; background:#fff; border-radius:30px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
  position:relative; z-index:10;
}
.heart{font-size:65px;animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.2)}}
h1{color:#ff1744}
p{color:#555;font-size:18px}
button{
  border:0;border-radius:30px;padding:14px 28px;
  font-size:17px;margin:10px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
#yes{background:#ff1744;color:white}
#no{background:#ddd;color:#333;position:relative}
#surprise{display:none}
.floating-heart{
  position:fixed;bottom:-50px;font-size:25px;
  animation:float 5s linear forwards;z-index:2;
}
@keyframes float{to{transform:translateY(-110vh);opacity:0}}
</style>
</head>
<body>

<div class="card" id="mainCard">
  <div class="heart">❤️</div>
  <h1>Hey You! 🥰</h1>
  <p>I have something important to ask you...</p>
  <h2>Will you be mine? 💕</h2>
  <button id="yes" type="button">YES ❤️</button>
  <button id="no" type="button">NO 😜</button>
</div>

<div class="card" id="surprise">
  <div class="heart">💖</div>
  <h1>Yayyyy! 🥹❤️</h1>
  <p>You just made my heart the happiest! 💕</p>
  <h2>It's a YES! 🥰</h2>
  <p>Let's make some beautiful memories together ✨</p>
</div>

<script>
const yes = document.getElementById("yes");
const no = document.getElementById("no");

function showSurprise(){
  document.getElementById("mainCard").style.display="none";
  document.getElementById("surprise").style.display="block";
  for(let i=0;i<30;i++) setTimeout(createHeart,i*70);
}

yes.addEventListener("click", showSurprise);
yes.addEventListener("touchend", function(e){
  e.preventDefault();
  showSurprise();
});

function moveNo(){
  const x=Math.random()*160-80;
  const y=Math.random()*120-60;
  no.style.transform=`translate(${x}px,${y}px)`;
}
no.addEventListener("mouseenter",moveNo);
no.addEventListener("touchstart",function(e){
  e.preventDefault();
  moveNo();
});

function createHeart(){
  const h=document.createElement("div");
  h.className="floating-heart";
  h.textContent="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(3+Math.random()*3)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6500);
}
setInterval(createHeart,900);
</script>
</body>
</html>
